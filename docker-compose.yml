services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: jobhub
      POSTGRES_PASSWORD: jobhub
      POSTGRES_DB: jobhub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhub -d jobhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://jobhub:jobhub@db:5432/jobhub
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: